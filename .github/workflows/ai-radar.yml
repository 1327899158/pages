name: Update AI Radar and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-radar-src/package-lock.json
      - run: npm ci
        working-directory: ai-radar-src
      - run: npm run collect
        working-directory: ai-radar-src
      - run: npm run build
        working-directory: ai-radar-src
      - name: Save latest snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-radar
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI Radar snapshots'
            git push
          fi
      - name: Prepare existing website and AI Radar
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='ai-radar-src' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
