name: Update AI Radar and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      translation_provider:
        description: 'Manual translation provider (none updates news only)'
        type: choice
        default: none
        options:
          - none
          - tencent
          - google
          - deepl
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-radar-src/package-lock.json
      - run: npm ci
        working-directory: ai-radar-src
      - run: npm run collect
        working-directory: ai-radar-src
      - name: Translate titles with selected provider
        if: github.event_name == 'workflow_dispatch' && inputs.translation_provider != 'none'
        run: node --experimental-strip-types scripts/translate-paid.mjs
        working-directory: ai-radar-src
        env:
          TRANSLATION_PROVIDER: ${{ inputs.translation_provider }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID || secrets.SECRETID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY || secrets.SECRETKEY }}
      - run: npm run build
        working-directory: ai-radar-src
      - name: Save latest snapshots
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node ai-radar-src/scripts/save-snapshots.mjs
      - name: Prepare existing website and AI Radar
        if: steps.save.outputs.publish == 'true'
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='ai-radar-src' ./ _site/
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.save.outputs.publish == 'true'
        with:
          path: _site
      - name: Deploy
        if: steps.save.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
